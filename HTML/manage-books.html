<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manage Books</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

<div class="admin-header">Manage Books</div>

<div class="admin-container">

<!-- SIDEBAR -->
<div class="admin-sidebar">
<a href="admin-dashboard.html">Dashboard</a>
<a href="manage-books.html" class="active">Manage Books</a>
<a href="approve-requests.html">Approve Requests</a>
<a href="admin-complaints.html">Complaints</a>
<a href="index.html">Logout</a>
</div>

<!-- CONTENT -->
<div class="admin-content">

<h2>Add Book</h2>

<input type="text" id="bookName" placeholder="Book Name"><br><br>
<input type="text" id="bookAuthor" placeholder="Author"><br><br>

<button onclick="addBook()" class="approve-btn">Add Book</button>

<h2 style="margin-top:30px;">All Books</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Author</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="bookTable"></tbody>

</table>

</div>

</div>

<script>

//  LOAD BOOKS
async function loadBooks(){
    try{
        let res = await fetch("http://127.0.0.1:5000/api/books");
        let data = await res.json();

        console.log("LOAD STATUS:", res.status);

        let table = document.getElementById("bookTable");
        table.innerHTML = "";

        if(data.length === 0){
            table.innerHTML = "<tr><td colspan='5'>No Books Found</td></tr>";
            return;
        }

        data.forEach(book=>{
            table.innerHTML += `
            <tr>
                <td>${book._id}</td>
                <td>${book.name}</td>
                <td>${book.author}</td>
                <td class="${book.status === 'Available' ? 'available' : 'issued'}">
                    ${book.status}
                </td>
                <td>
                    <button onclick="deleteBook('${book._id}')">Delete</button>
                </td>
            </tr>
            `;
        });

    }catch(err){
        console.log("LOAD ERROR:", err);
    }
}


//  ADD BOOK
async function addBook(){
    try{
        console.log("ADD CLICKED");

        let name = document.getElementById("bookName").value.trim();
        let author = document.getElementById("bookAuthor").value.trim();

        if(!name || !author){
            alert("Fill all fields");
            return;
        }

        let res = await fetch("http://127.0.0.1:5000/api/admin/add-book",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({name, author})
        });

        console.log("ADD STATUS:", res.status);

        let data = await res.json();
        console.log("ADD RESULT:", data);

        if(data.success){
            alert("Book Added ✅");
        }else{
            alert("Add Failed ❌");
        }

        // clear input
        document.getElementById("bookName").value = "";
        document.getElementById("bookAuthor").value = "";

        loadBooks();

    }catch(err){
        console.log("ADD ERROR:", err);
    }
}


//  DELETE BOOK
async function deleteBook(id){
    try{
        console.log("DELETE CLICKED:", id);

        let res = await fetch("http://127.0.0.1:5000/api/admin/delete-book/" + id,{
            method:"DELETE"
        });

        console.log("DELETE STATUS:", res.status);

        let data = await res.json();
        console.log("DELETE RESULT:", data);

        if(data.success){
            alert("Deleted ✅");
        }else{
            alert("Delete Failed ❌");
        }

        loadBooks();

    }catch(err){
        console.log("DELETE ERROR:", err);
    }
}


// 🔥 FIRST LOAD
loadBooks();

</script>

</body>
</html>
