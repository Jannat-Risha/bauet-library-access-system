<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>My Reservations</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
        }

        .header {
            background: #1e2a78;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #2f3eb1;
            min-height: 100vh;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 14px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1b277c;
        }

        .active {
            background: #0f1a5c;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #eef1f8;
        }

        .pending {
            color: orange;
            font-weight: bold;
        }

        .approved {
            color: green;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="header">BAUET Smart Library Access System</div>

    <div class="container">

        <div class="sidebar">
            <a href="dashboard.html">Dashboard</a>
            <a href="book-search.html">Book Search</a>
            <a href="issue-return.html">Issue / Return</a>
            <a href="reservation.html" class="active">My Reservations</a>
            <a href="notifications.html">Notifications</a>
            <a href="complaints.html">Complaints</a>
            <a href="index.html">Logout</a>
        </div>

        <div class="content">
            <h2>Book Reservations</h2>
            <p>Track your reserved books</p>

            <table>
                <thead>
                    <tr>
                        <th>Reservation ID</th>
                        <th>Book Name</th>
                        <th>Reserved Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <!--  dynamic data here -->
                <tbody id="resTable"></tbody>
            </table>
        </div>

    </div>

<script>
async function loadReservations(){
    try{
        let res = await fetch("http://127.0.0.1:5000/api/reservations");
        let data = await res.json();

        let table = document.getElementById("resTable");
        table.innerHTML = "";

        // ❗data blank
        if(data.length === 0){
            table.innerHTML = "<tr><td colspan='4'>No Reservations</td></tr>";
            return;
        }

        //  loop  show
        data.forEach((r,i)=>{
            table.innerHTML += `
                <tr>
                    <td>R-${100+i}</td>
                    <td>${r.book}</td>
                    <td>${new Date().toLocaleDateString()}</td>
                    <td class="${r.status === 'Approved' ? 'approved' : 'pending'}">
                        ${r.status}
                    </td>
                </tr>
            `;
        });

    }catch(err){
        console.log("ERROR:", err);
    }
}

// page load call
loadReservations();
</script>

</body>

</html>
