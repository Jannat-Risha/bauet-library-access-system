<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Book Detail</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">Book Detail</div>

<div class="container">

<div class="sidebar">
<a href="dashboard.html">Dashboard</a>
<a href="book-detail.html" class="active">Book Detail</a>
<a href="profile.html">Profile</a>
<a href="about.html">About</a>
<a href="index.html">Logout</a>
</div>

<div class="content">

<h2>Book Details</h2>

<table>
<thead>
<tr>
<th>Book Name</th>
<th>Author</th>
<th>Status</th>
</tr>
</thead>

<tbody id="bookTable"></tbody>

</table>

</div>

</div>

<script>
async function loadBooks(){

    let res = await fetch("http://127.0.0.1:5000/api/books");
    let data = await res.json();

    let table = document.getElementById("bookTable");
    table.innerHTML = "";

    if(data.length === 0){
        table.innerHTML = "<tr><td colspan='3'>No Books Found</td></tr>";
        return;
    }

    data.forEach(book=>{
        table.innerHTML += `
        <tr>
            <td>${book.name}</td>
            <td>${book.author}</td>
            <td class="${book.status === 'Available' ? 'available' : 'issued'}">
                ${book.status}
            </td>
        </tr>
        `;
    });
}

loadBooks();
</script>

</body>
