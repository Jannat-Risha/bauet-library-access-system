<div class="content">
    <h2>Notifications</h2>

    <div id="notiBox"></div>
</div>

</div>

<script>
async function loadNotifications(){
    let res = await fetch("http://127.0.0.1:5000/api/notifications");
    let data = await res.json();

    let box = document.getElementById("notiBox");
    box.innerHTML = "";

    if(data.length === 0){
        box.innerHTML = "<p>No Notifications</p>";
        return;
    }

    data.forEach(n=>{
        box.innerHTML += `
            <div style="background:#fff;padding:10px;margin:10px 0;border-left:5px solid red;">
                ${n.message}
            </div>
        `;
    });
}

loadNotifications();
</script>

</body>
