<body>

<div class="header">Profile</div>

<div class="container">

<div class="sidebar">

</div>

<div class="content">

<h2>My Profile</h2>

<div class="box" style="text-align:center">

<!-- PROFILE IMAGE -->
<img id="profilePic" width="120" style="border-radius:50%; margin-bottom:15px;">

<p><strong>Name:</strong> <span id="name">Loading...</span></p>
<p><strong>ID:</strong> <span id="id">Loading...</span></p>
<p><strong>Email:</strong> <span id="email">Loading...</span></p>

</div>

</div>

</div>

<script>
async function loadProfile(){

    let userId = "12345";

    try{
        let res = await fetch("http://127.0.0.1:5000/api/profile/" + userId);
        let data = await res.json();

        console.log("PROFILE:", data); // debug

        if(!data){
            document.getElementById("name").innerText = "User not found";
            return;
        }

        document.getElementById("name").innerText = data.username || "N/A";
        document.getElementById("id").innerText = data.username || "N/A";
        document.getElementById("email").innerText = data.email || "N/A";

        //  image safe load
        if(data.image){
            document.getElementById("profilePic").src = data.image;
        } else {
            document.getElementById("profilePic").src = "https://via.placeholder.com/120";
        }

    }catch(err){
        console.log("ERROR:", err);
        alert("Server problem");
    }
}

loadProfile();
</script>

</body>
</html>
