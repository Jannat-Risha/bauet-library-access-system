<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Complaints | BAUET Smart Library Access System</title>
    <link rel="stylesheet" href="complaints.css">
</head>

<body>

    <div class="header">
        BAUET Smart Library Access System
    </div>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <a href="dashboard.html">Dashboard</a>
            <a href="book-search.html">Book Search</a>
            <a href="issue-return.html">Issue / Return</a>
            <a href="reservation.html">My Reservations</a>
            <a href="notifications.html">Notifications</a>
            <a href="complaints.html" class="active">Complaints</a>
            <a href="index.html">Logout</a>
        </div>

        <!-- Content -->
        <div class="content">
            <h2>Submit a Complaint</h2>
            <p class="subtitle">
                Report library-related issues for quick resolution
            </p>

            <!-- Complaint Form -->
            <div class="box">
                <h3>Complaint Form</h3>

                <input type="text" id="studentId" placeholder="Student ID">

                <select id="complaintType">
                    <option value="">Select Complaint Type</option>
                    <option>Internet Problem</option>
                    <option>Seating Issue</option>
                    <option>Lighting / Environment</option>
                    <option>Book Related Issue</option>
                    <option>Other</option>
                </select>

                <textarea id="complaintMsg" placeholder="Describe your problem..."></textarea>

                <button class="submit-btn" onclick="submitComplaint()">Submit Complaint</button>
            </div>

            <!-- Complaint Status -->
            <div class="box">
                <h3>My Complaint Status</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Complaint ID</th>
                            <th>Type</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="complaintTable"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 🔥 submit complaint
        async function submitComplaint() {
            let user = document.getElementById("studentId").value;
            let type = document.getElementById("complaintType").value;
            let message = document.getElementById("complaintMsg").value;

            if (!user || !type || !message) {
                alert("Fill all fields");
                return;
            }

            let res = await fetch("http://127.0.0.1:5000/api/complaints", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user, type, message })
            });

            let data = await res.json();

            if (data.success) {
                alert("Complaint Submitted");
                loadComplaints();
            }
        }

        // 🔥 load complaints
        async function loadComplaints() {
            let res = await fetch("http://127.0.0.1:5000/api/complaints");
            let data = await res.json();

            let table = document.getElementById("complaintTable");
            table.innerHTML = "";

            if (data.length === 0) {
                table.innerHTML = "<tr><td colspan='3'>No Complaints</td></tr>";
                return;
            }

            data.forEach((c, i) => {
                table.innerHTML += `
            <tr>
                <td>C-${100 + i}</td>
                <td>${c.type}</td>
                <td class="${c.status === 'Pending' ? 'pending' : 'resolved'}">
                    ${c.status}
                </td>
            </tr>
        `;
            });
        }

        loadComplaints();
    </script>

</body>

</html>
