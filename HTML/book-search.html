<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Book Search | BAUET Smart Library Access System</title>
    <link rel="stylesheet" href="book-search.css">
</head>

<body>

    <div class="header">BAUET Smart Library Access System</div>

    <div class="container">
        <div class="sidebar">
            <a href="dashboard.html">Dashboard</a>
            <a href="book-search.html" class="active">Book Search</a>
            <a href="issue-return.html">Issue / Return</a>
            <a href="reservation.html">My Reservations</a>
            <a href="notifications.html">Notifications</a>
            <a href="complaints.html">Complaints</a>
            <a href="index.html">Logout</a>
        </div>

        <div class="content">
            <h2>Search & Track Books</h2>
            <p class="subtitle">View real-time book availability</p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Enter book name or author">
                <button onclick="searchBooks()">Search</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Book Name</th>
                        <th>Author</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="bookTable">
                </tbody>
            </table>
        </div>
    </div>

<script>
console.log("JS RUNNING ✅");

let booksData = [];

//  LOAD BOOKS FROM BACKEND
async function loadBooks(){
    try{
        console.log("FETCH START");

        let res = await fetch("http://127.0.0.1:5000/api/books");

        console.log("RESPONSE:", res);

        let data = await res.json();

        console.log("DATA:", data);

        booksData = data;

        displayBooks(data);
    }
    catch(err){
        console.log("ERROR:", err);
    }
}

//  SHOW BOOKS IN TABLE
function displayBooks(books){
    let table = document.getElementById("bookTable");
    table.innerHTML = "";

    if(books.length === 0){
        table.innerHTML = "<tr><td colspan='4'>No books found</td></tr>";
        return;
    }

    books.forEach((b,i)=>{
        table.innerHTML += `
            <tr>
                <td>${i+1}</td>
                <td>${b.name}</td>
                <td>${b.author}</td>
                <td class="${b.status === 'Available' ? 'available' : 'issued'}">
                    ${b.status}
                </td>
            </tr>
        `;
    });
}

//  SEARCH FUNCTION
function searchBooks(){
    let text = document.getElementById("searchInput").value.toLowerCase();

    let filtered = booksData.filter(b =>
        b.name.toLowerCase().includes(text) ||
        b.author.toLowerCase().includes(text)
    );

    displayBooks(filtered);
}

//  CALL ON PAGE LOAD
loadBooks();
</script>

</body>
</html>
